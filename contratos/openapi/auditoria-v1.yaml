openapi: 3.1.0

info:
  title: Auditoria.Utility
  version: 1.0.0
  description: |
    Servicio de **utilidad**. Registro append-only de toda operación del sistema.

    Es el servicio con más peso en la nota del curso: la auditoría ocupa las
    sesiones 31–34 del sílabo, justo antes del PROY. Además registra **todo
    mensaje que cruza el ESB**, lo que la convierte en la evidencia de
    trazabilidad extremo a extremo.

    **Append-only, sin excepciones** (RNF-08): no existe `PUT` ni `DELETE` en
    este contrato. Una entrada equivocada se corrige con otra entrada que la
    referencia, nunca borrándola.

    Cubre RNF-11 y RNF-08.

servers:
  - url: http://localhost:3012
    description: Desarrollo local

security:
  - TokenServicio: []

tags:
  - name: registro
    description: Alta de entradas de auditoría
  - name: consulta
    description: Búsqueda y trazabilidad

paths:
  /entradas:
    post:
      operationId: RegistrarEntrada
      tags: [registro]
      summary: Registra una operación en el log de auditoría
      description: |
        La auditoría **nunca debe tumbar la operación de negocio**. Si este
        servicio no responde, el llamante encola localmente y reintenta; la
        venta sigue adelante. Por eso la respuesta es `202 Accepted`: se acusa
        recibo sin obligar al llamante a esperar la persistencia.
      parameters:
        - $ref: '_comunes-v1.yaml#/components/parameters/CorrelationId'
        - $ref: '_comunes-v1.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevaEntrada' }
            examples:
              venta:
                summary: Venta registrada por un cajero
                value:
                  correlationId: '3f7c1e94-9b2a-4d51-a8e3-6c0f5d2b8a17'
                  servicio: 'Venta.Entity'
                  accion: 'VENTA_REGISTRADA'
                  recurso: 'venta'
                  recursoId: 'a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d'
                  usuario: 'cajero01'
                  detalle: { total: 120.00, comprobante: 'F001-128' }
              anulacion:
                summary: Anulación autorizada por un supervisor
                value:
                  correlationId: '7c1e943f-2a9b-4d51-a8e3-6c0f5d2b8a18'
                  servicio: 'Venta.Entity'
                  accion: 'VENTA_ANULADA'
                  recurso: 'venta'
                  recursoId: 'a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d'
                  usuario: 'supervisor01'
                  detalle: { motivo: 'Error de digitacion', operadaPor: 'cajero01' }
      responses:
        '202':
          description: Entrada aceptada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaEntrada' }
        '400': { $ref: '_comunes-v1.yaml#/components/responses/SolicitudInvalida' }
        '401': { $ref: '_comunes-v1.yaml#/components/responses/NoAutorizado' }

  /entradas/lote:
    post:
      operationId: RegistrarLote
      tags: [registro]
      summary: Registra varias entradas de una vez
      description: >
        Lo usa el terminal al reconectar, para drenar las entradas que quedaron
        encoladas mientras operaba sin internet (RNF-01).
      parameters:
        - $ref: '_comunes-v1.yaml#/components/parameters/CorrelationId'
        - $ref: '_comunes-v1.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entradas]
              properties:
                entradas:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: '#/components/schemas/NuevaEntrada' }
      responses:
        '202':
          description: Lote aceptado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito: { type: boolean, const: true }
                  datos:
                    type: object
                    properties:
                      aceptadas: { type: integer }
                      duplicadas:
                        type: integer
                        description: Ya registradas antes. No se duplican (RNF-09).
                  meta: { $ref: '_comunes-v1.yaml#/components/schemas/Meta' }
        '400': { $ref: '_comunes-v1.yaml#/components/responses/SolicitudInvalida' }
        '401': { $ref: '_comunes-v1.yaml#/components/responses/NoAutorizado' }

  /entradas/buscar:
    get:
      operationId: BuscarEntradas
      tags: [consulta]
      summary: Busca entradas por servicio, usuario, acción o rango de fechas
      parameters:
        - $ref: '_comunes-v1.yaml#/components/parameters/CorrelationId'
        - name: servicio
          in: query
          schema: { type: string }
        - name: usuario
          in: query
          schema: { type: string }
        - name: accion
          in: query
          schema: { type: string }
        - name: recurso
          in: query
          schema: { type: string }
        - name: desde
          in: query
          schema: { type: string, format: date-time }
        - name: hasta
          in: query
          schema: { type: string, format: date-time }
        - $ref: '_comunes-v1.yaml#/components/parameters/Pagina'
        - $ref: '_comunes-v1.yaml#/components/parameters/Limite'
      responses:
        '200':
          description: Entradas encontradas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito: { type: boolean, const: true }
                  datos:
                    type: array
                    items: { $ref: '#/components/schemas/Entrada' }
                  meta: { $ref: '_comunes-v1.yaml#/components/schemas/Meta' }
        '401': { $ref: '_comunes-v1.yaml#/components/responses/NoAutorizado' }
        '403': { $ref: '_comunes-v1.yaml#/components/responses/Prohibido' }

  /trazas/{correlationId}:
    get:
      operationId: ConsultarTraza
      tags: [consulta]
      summary: Reconstruye el recorrido completo de una operación
      description: |
        Devuelve, en orden cronológico, cada paso que dio una operación a través
        de todos los servicios y del ESB.

        Es la evidencia de trazabilidad que exige el PROY: permite responder
        *"¿qué le pasó exactamente a esta venta?"* siguiendo un solo identificador
        desde el terminal hasta SUNAT.
      parameters:
        - name: correlationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Traza completa de la operación.
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito: { type: boolean, const: true }
                  datos:
                    type: object
                    properties:
                      correlationId: { type: string }
                      iniciadaEn: { type: string, format: date-time }
                      finalizadaEn: { type: string, format: date-time }
                      serviciosInvolucrados:
                        type: array
                        items: { type: string }
                      pasos:
                        type: array
                        items: { $ref: '#/components/schemas/Entrada' }
                  meta: { $ref: '_comunes-v1.yaml#/components/schemas/Meta' }
        '401': { $ref: '_comunes-v1.yaml#/components/responses/NoAutorizado' }
        '404': { $ref: '_comunes-v1.yaml#/components/responses/NoEncontrado' }

components:
  securitySchemes:
    TokenServicio:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    NuevaEntrada:
      type: object
      required: [correlationId, servicio, accion, recurso, usuario]
      properties:
        correlationId:
          type: string
          description: Identificador que une todos los pasos de una misma operación.
        servicio:
          type: string
          description: Servicio que produjo la entrada.
          examples: ['Venta.Entity']
        accion:
          type: string
          description: Qué se hizo, en pasado y en mayúsculas.
          examples: ['VENTA_REGISTRADA']
        recurso:
          type: string
          examples: ['venta']
        recursoId: { type: string }
        usuario:
          type: string
          description: >
            Quién lo hizo. En operaciones elevadas es el supervisor que autorizó,
            no el cajero que operó (ADR-001). `sistema` para procesos automáticos.
        timestamp:
          type: string
          format: date-time
          description: Si se omite, lo pone el servicio al recibir.
        detalle:
          type: object
          description: Contexto del cambio. Nunca datos sensibles en claro.
          additionalProperties: true

    Entrada:
      allOf:
        - $ref: '#/components/schemas/NuevaEntrada'
        - type: object
          required: [uuid, timestamp]
          properties:
            uuid: { $ref: '_comunes-v1.yaml#/components/schemas/Uuid' }
            timestamp: { type: string, format: date-time }
            recibidoEn: { type: string, format: date-time }

    RespuestaEntrada:
      type: object
      required: [exito, datos, error, meta]
      properties:
        exito: { type: boolean, const: true }
        datos:
          type: object
          properties:
            uuid: { $ref: '_comunes-v1.yaml#/components/schemas/Uuid' }
            aceptada: { type: boolean }
        error: { type: 'null' }
        meta: { $ref: '_comunes-v1.yaml#/components/schemas/Meta' }
