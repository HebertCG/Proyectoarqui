openapi: 3.1.0

info:
  title: Seguridad.Utility
  version: 1.0.0
  description: |
    Servicio de **utilidad**. Gestiona usuarios, roles y la autorización de
    operaciones sensibles.

    Implementa el modelo de ADR-001: tres roles fijos y **elevación por PIN**.
    Ante una operación sensible el terminal pide el PIN de un supervisor
    presente sin cerrar la sesión del cajero; la auditoría registra al
    supervisor que **autorizó**, no al que opera.

    | Rol | Puede |
    |---|---|
    | CAJERO | Vender, cobrar, consultar |
    | SUPERVISOR | + anular, descuento manual, abrir/cerrar caja |
    | ADMINISTRADOR | + precios, catálogo, usuarios |

    Cubre RNF-06 y habilita RNF-11.

servers:
  - url: http://localhost:3011
    description: Desarrollo local

security:
  - TokenServicio: []

tags:
  - name: autenticacion
    description: Inicio de sesión y emisión de tokens
  - name: autorizacion
    description: Elevación por PIN para operaciones sensibles
  - name: usuarios
    description: Gestión de usuarios y roles

paths:
  /sesiones:
    post:
      operationId: IniciarSesion
      tags: [autenticacion]
      summary: Autentica un usuario y emite un token de servicio
      security: []
      parameters:
        - $ref: '_comunes-v1.yaml#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuario, clave]
              properties:
                usuario: { type: string, minLength: 1, maxLength: 60 }
                clave: { type: string, minLength: 8, format: password }
                cajaId:
                  type: string
                  description: Punto de emisión desde el que inicia sesión.
      responses:
        '200':
          description: Sesión iniciada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaSesion' }
        '400': { $ref: '_comunes-v1.yaml#/components/responses/SolicitudInvalida' }
        '401': { $ref: '_comunes-v1.yaml#/components/responses/NoAutorizado' }

  /autorizaciones:
    post:
      operationId: AutorizarOperacion
      tags: [autorizacion]
      summary: Canjea el PIN de un supervisor por una autorización de un solo uso
      description: |
        El PIN **nunca viaja hacia otros servicios**: se canjea aquí por un
        `codigoAutorizacion` ligado a una operación concreta y de un solo uso.
        Lo consume el servicio que ejecuta la operación (por ejemplo
        `Venta.Service` al anular).

        Si el usuario del PIN no tiene el rol necesario, devuelve 403.
      parameters:
        - $ref: '_comunes-v1.yaml#/components/parameters/CorrelationId'
        - $ref: '_comunes-v1.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin, operacion]
              properties:
                pin: { type: string, minLength: 4, maxLength: 8, format: password }
                operacion: { $ref: '#/components/schemas/OperacionSensible' }
                recursoUuid: { $ref: '_comunes-v1.yaml#/components/schemas/Uuid' }
                contexto:
                  type: object
                  description: Datos de la operación, para dejar constancia en auditoría.
                  additionalProperties: true
      responses:
        '200':
          description: Autorización concedida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaAutorizacion' }
        '400': { $ref: '_comunes-v1.yaml#/components/responses/SolicitudInvalida' }
        '401': { $ref: '_comunes-v1.yaml#/components/responses/NoAutorizado' }
        '403': { $ref: '_comunes-v1.yaml#/components/responses/Prohibido' }

  /autorizaciones/{codigo}/consumir:
    post:
      operationId: ConsumirAutorizacion
      tags: [autorizacion]
      summary: Consume una autorización, invalidándola
      description: >
        Un código sirve una sola vez. Reintentarlo devuelve 409, lo que impide
        reutilizar una autorización de supervisor para más de una operación.
      parameters:
        - name: codigo
          in: path
          required: true
          schema: { type: string }
        - $ref: '_comunes-v1.yaml#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Autorización consumida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito: { type: boolean, const: true }
                  datos:
                    type: object
                    properties:
                      autorizadoPor: { type: string }
                      operacion: { $ref: '#/components/schemas/OperacionSensible' }
                  meta: { $ref: '_comunes-v1.yaml#/components/schemas/Meta' }
        '401': { $ref: '_comunes-v1.yaml#/components/responses/NoAutorizado' }
        '404': { $ref: '_comunes-v1.yaml#/components/responses/NoEncontrado' }
        '409': { $ref: '_comunes-v1.yaml#/components/responses/Conflicto' }

  /usuarios:
    get:
      operationId: ListarUsuarios
      tags: [usuarios]
      summary: Lista los usuarios del sistema
      parameters:
        - $ref: '_comunes-v1.yaml#/components/parameters/CorrelationId'
        - $ref: '_comunes-v1.yaml#/components/parameters/Pagina'
        - $ref: '_comunes-v1.yaml#/components/parameters/Limite'
      responses:
        '200':
          description: Listado de usuarios.
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito: { type: boolean, const: true }
                  datos:
                    type: array
                    items: { $ref: '#/components/schemas/Usuario' }
                  meta: { $ref: '_comunes-v1.yaml#/components/schemas/Meta' }
        '401': { $ref: '_comunes-v1.yaml#/components/responses/NoAutorizado' }
        '403': { $ref: '_comunes-v1.yaml#/components/responses/Prohibido' }

    post:
      operationId: RegistrarUsuario
      tags: [usuarios]
      summary: Crea un usuario con su rol
      parameters:
        - $ref: '_comunes-v1.yaml#/components/parameters/CorrelationId'
        - $ref: '_comunes-v1.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevoUsuario' }
      responses:
        '201':
          description: Usuario creado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito: { type: boolean, const: true }
                  datos: { $ref: '#/components/schemas/Usuario' }
                  meta: { $ref: '_comunes-v1.yaml#/components/schemas/Meta' }
        '400': { $ref: '_comunes-v1.yaml#/components/responses/SolicitudInvalida' }
        '401': { $ref: '_comunes-v1.yaml#/components/responses/NoAutorizado' }
        '403': { $ref: '_comunes-v1.yaml#/components/responses/Prohibido' }
        '409': { $ref: '_comunes-v1.yaml#/components/responses/Conflicto' }

  /usuarios/{uuid}:
    patch:
      operationId: ActualizarUsuario
      tags: [usuarios]
      summary: Modifica el rol o el estado de un usuario
      description: >
        Los usuarios se desactivan, nunca se eliminan: su historial de
        autorizaciones debe seguir siendo trazable (RNF-08).
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { $ref: '_comunes-v1.yaml#/components/schemas/Uuid' }
        - $ref: '_comunes-v1.yaml#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rol: { $ref: '_comunes-v1.yaml#/components/schemas/Rol' }
                activo: { type: boolean }
      responses:
        '200':
          description: Usuario actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito: { type: boolean, const: true }
                  datos: { $ref: '#/components/schemas/Usuario' }
                  meta: { $ref: '_comunes-v1.yaml#/components/schemas/Meta' }
        '401': { $ref: '_comunes-v1.yaml#/components/responses/NoAutorizado' }
        '403': { $ref: '_comunes-v1.yaml#/components/responses/Prohibido' }
        '404': { $ref: '_comunes-v1.yaml#/components/responses/NoEncontrado' }

components:
  securitySchemes:
    TokenServicio:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    OperacionSensible:
      type: string
      description: Operaciones que exigen autorización de supervisor (RNF-06).
      enum:
        - ANULAR_VENTA
        - DEVOLVER_VENTA
        - DESCUENTO_MANUAL
        - ABRIR_CAJA
        - CERRAR_CAJA
        - MODIFICAR_PRECIO

    Usuario:
      type: object
      required: [uuid, usuario, nombre, rol, activo]
      properties:
        uuid: { $ref: '_comunes-v1.yaml#/components/schemas/Uuid' }
        usuario: { type: string }
        nombre: { type: string }
        rol: { $ref: '_comunes-v1.yaml#/components/schemas/Rol' }
        activo: { type: boolean }
        trazabilidad: { $ref: '_comunes-v1.yaml#/components/schemas/Trazabilidad' }

    NuevoUsuario:
      type: object
      required: [usuario, nombre, rol, clave]
      properties:
        usuario: { type: string, minLength: 3, maxLength: 60 }
        nombre: { type: string, minLength: 1, maxLength: 120 }
        rol: { $ref: '_comunes-v1.yaml#/components/schemas/Rol' }
        clave: { type: string, minLength: 8, format: password }
        pin:
          type: string
          minLength: 4
          maxLength: 8
          format: password
          description: Solo para SUPERVISOR y ADMINISTRADOR.

    RespuestaSesion:
      type: object
      required: [exito, datos, error, meta]
      properties:
        exito: { type: boolean, const: true }
        datos:
          type: object
          required: [token, expiraEn, usuario]
          properties:
            token: { type: string }
            expiraEn: { type: string, format: date-time }
            usuario: { $ref: '#/components/schemas/Usuario' }
        error: { type: 'null' }
        meta: { $ref: '_comunes-v1.yaml#/components/schemas/Meta' }

    RespuestaAutorizacion:
      type: object
      required: [exito, datos, error, meta]
      properties:
        exito: { type: boolean, const: true }
        datos:
          type: object
          required: [codigoAutorizacion, autorizadoPor, expiraEn]
          properties:
            codigoAutorizacion:
              type: string
              description: De un solo uso. Se invalida al consumirlo.
            autorizadoPor:
              type: string
              description: Usuario del supervisor. Es el que queda en auditoría.
            operacion: { $ref: '#/components/schemas/OperacionSensible' }
            expiraEn: { type: string, format: date-time }
        error: { type: 'null' }
        meta: { $ref: '_comunes-v1.yaml#/components/schemas/Meta' }
