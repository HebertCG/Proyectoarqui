openapi: 3.1.0

info:
  title: ValidacionDocumento.Utility
  version: 1.0.0
  description: |
    Servicio de **utilidad** (agnóstico al negocio). Decide qué comprobante puede
    emitirse según el identificador del cliente.

    | Documento | Comprobante habilitado |
    |---|---|
    | DNI (8 dígitos) | Boleta de venta |
    | RUC (11 dígitos, prefijo 10/15/17/20) | Factura |
    | Genérico (sin documento) | Nota de venta |

    **Por qué existe como servicio:** RNF-18 exige que esta regla se aplique
    igual en Desktop offline y en Web. Un solo servicio, una sola regla, dos
    consumidores — es la demostración del principio P4 (reutilización).

    Cubre RF-POS-17, RF-POS-18, RF-POS-19, RF-CRM-02, RNF-18.

servers:
  - url: http://localhost:3010
    description: Desarrollo local

security:
  - TokenServicio: []

tags:
  - name: validacion
    description: Reglas de compatibilidad documento ↔ comprobante

paths:
  /validaciones/documento:
    post:
      operationId: ValidarDocumento
      tags: [validacion]
      summary: Valida el formato de un documento y devuelve los comprobantes permitidos
      description: |
        Operación **sin estado** y **pura**: mismas entradas, mismo resultado.
        No consulta base de datos ni servicios externos, por lo que puede
        replicarse en el terminal para operar offline (RNF-01).
      parameters:
        - $ref: '_comunes-v1.yaml#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValidarDocumentoRequest' }
            examples:
              ruc:
                summary: RUC de persona jurídica
                value: { tipoDocumento: RUC, numeroDocumento: '20512345678' }
              dni:
                summary: DNI de persona natural
                value: { tipoDocumento: DNI, numeroDocumento: '45678912' }
              generico:
                summary: Cliente sin documento tributario
                value: { tipoDocumento: GENERICO }
      responses:
        '200':
          description: Resultado de la validación. Un documento inválido NO es error HTTP.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidarDocumentoResponse' }
        '400': { $ref: '_comunes-v1.yaml#/components/responses/SolicitudInvalida' }
        '401': { $ref: '_comunes-v1.yaml#/components/responses/NoAutorizado' }

  /validaciones/comprobante:
    post:
      operationId: VerificarCompatibilidad
      tags: [validacion]
      summary: Verifica si un tipo de comprobante es emitible para un documento
      description: |
        Lo consume `Venta.Service` antes de cerrar el ticket (RF-POS-18). Si
        devuelve `compatible: false`, el cierre debe bloquearse: emitir de todos
        modos produciría un comprobante que SUNAT rechazará.
      parameters:
        - $ref: '_comunes-v1.yaml#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificarCompatibilidadRequest' }
            examples:
              incompatible:
                summary: RUC al que se le quiere emitir Boleta
                value:
                  tipoDocumento: RUC
                  numeroDocumento: '20512345678'
                  tipoComprobante: BOLETA
      responses:
        '200':
          description: Veredicto de compatibilidad.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificarCompatibilidadResponse' }
        '400': { $ref: '_comunes-v1.yaml#/components/responses/SolicitudInvalida' }
        '401': { $ref: '_comunes-v1.yaml#/components/responses/NoAutorizado' }

  /health:
    get:
      operationId: ConsultarSalud
      summary: Estado del servicio
      security: []
      responses:
        '200':
          description: El servicio responde.
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito: { type: boolean }
                  datos:
                    type: object
                    properties:
                      estado: { type: string, examples: ['ok'] }
                      servicio: { type: string }
                      version: { type: string }

components:
  securitySchemes:
    TokenServicio:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ValidarDocumentoRequest:
      type: object
      required: [tipoDocumento]
      properties:
        tipoDocumento: { $ref: '_comunes-v1.yaml#/components/schemas/TipoDocumento' }
        numeroDocumento:
          type: string
          description: Obligatorio salvo cuando tipoDocumento es GENERICO.
          examples: ['20512345678']

    ValidarDocumentoResponse:
      type: object
      required: [exito, datos, error, meta]
      properties:
        exito: { type: boolean, const: true }
        datos: { $ref: '#/components/schemas/ResultadoValidacion' }
        error: { type: 'null' }
        meta: { $ref: '_comunes-v1.yaml#/components/schemas/Meta' }

    ResultadoValidacion:
      type: object
      required: [valido, tipoDocumento, comprobantesPermitidos]
      properties:
        valido:
          type: boolean
          description: Si el formato del documento es correcto.
        tipoDocumento: { $ref: '_comunes-v1.yaml#/components/schemas/TipoDocumento' }
        numeroDocumento: { type: string }
        comprobantesPermitidos:
          type: array
          description: Vacío si el documento es inválido.
          items: { $ref: '_comunes-v1.yaml#/components/schemas/TipoComprobante' }
          examples: [['FACTURA']]
        motivo:
          type: string
          description: Presente solo cuando `valido` es false.
          examples: ['El RUC debe tener 11 dígitos y empezar en 10, 15, 17 o 20.']

    VerificarCompatibilidadRequest:
      type: object
      required: [tipoDocumento, tipoComprobante]
      properties:
        tipoDocumento: { $ref: '_comunes-v1.yaml#/components/schemas/TipoDocumento' }
        numeroDocumento: { type: string }
        tipoComprobante: { $ref: '_comunes-v1.yaml#/components/schemas/TipoComprobante' }

    VerificarCompatibilidadResponse:
      type: object
      required: [exito, datos, error, meta]
      properties:
        exito: { type: boolean, const: true }
        datos:
          type: object
          required: [compatible]
          properties:
            compatible: { type: boolean }
            motivo:
              type: string
              examples: ['Un cliente identificado con RUC requiere Factura, no Boleta.']
            sugerido: { $ref: '_comunes-v1.yaml#/components/schemas/TipoComprobante' }
        error: { type: 'null' }
        meta: { $ref: '_comunes-v1.yaml#/components/schemas/Meta' }
